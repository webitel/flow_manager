version: v2

plugins:
  # Base types for Go. Generates message and enum types.
  - remote: buf.build/protocolbuffers/go:v1.30.0
    out: gen/ai_bots
    opt: paths=source_relative

  # Generates Go client and server stubs for the gRPC framework.
  - remote: buf.build/grpc/go:v1.3.0
    out: gen/ai_bots
    opt: paths=source_relative

  # Generates the grpc-gateway reverse proxy (REST/JSON -> gRPC) from the
  # google.api.http annotations on the admin/search RPCs.
  - remote: buf.build/grpc-ecosystem/gateway:v2.27.1
    out: gen/ai_bots
    opt: paths=source_relative

inputs:
  - directory: "../ai_bots/protos"
#  - git_repo: "https://github.com/webitel/protos"
#    branch: "main"
#    subdir: fts